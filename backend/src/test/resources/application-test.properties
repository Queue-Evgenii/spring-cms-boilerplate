# Профиль для тестов. Подключается через @ActiveProfiles("test").
# Локально используется отдельная БД, в CI значения приходят из переменных окружения.
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/cms_boilerplate_test}
spring.datasource.username=${TEST_DB_USERNAME:postgres}
spring.datasource.password=${TEST_DB_PASSWORD:}

spring.jpa.show-sql=false

# Фиктивные значения: тесты не должны зависеть от твоего .env
app.bootstrap-admin.email=test-admin@example.com
app.bootstrap-admin.password=test-password
